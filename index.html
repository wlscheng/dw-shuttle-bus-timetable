<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="牽晴間村巴">
<meta name="theme-color" content="#F4F6F8">
<title>牽晴間 穿梭巴士時間表 (Dawning Views Shuttle)</title>
<style>
:root {
  /* Brand Colors from Logo Analysis */
  --brand-green: #0D643A;
  --text-main: #151515;
  --accent-lime: #B2C916;
  --accent-blue: #158CB5;
  --bg-white: #FFFFFF;
  
  /* Derived UI Colors */
  --bg-app: #F4F6F8;
  --border-color: #E0E4E8;
  --text-muted: #6B7280;
  --row-hover: rgba(21, 140, 181, 0.08);
  
  /* Radii & Shadows */
  --radius-md: 12px;
  --radius-sm: 6px;
  --shadow-card: 0 4px 20px rgba(21, 21, 21, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  font-size: 10px;
  height: 100%;
}

body {
  height: 100%;
  overflow: hidden;
  background: var(--bg-app);
  color: var(--text-main);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Hiragino Sans CNS", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

.num { 
  font-variant-numeric: tabular-nums; 
  font-feature-settings: "tnum"; 
  letter-spacing: -0.01em; 
}

/* ---------- one-line masthead ---------- */
.bar {
  display: flex; 
  align-items: center; 
  gap: 1rem;
  padding: 0.5rem 0.5rem 1.5rem 0.5rem;
  flex: 0 0 auto; 
  white-space: nowrap; 
  overflow: hidden;
}

.bar h1 {
  font-size: 1.6rem; 
  font-weight: 700; 
  color: var(--brand-green);
  flex: 0 1 auto; 
  overflow: hidden; 
  text-overflow: ellipsis;
}

.bar .day {
  font-size: 1.1rem; 
  color: var(--text-muted);
  flex: 0 1 auto; 
  overflow: hidden; 
  text-overflow: ellipsis;
}

.bar .clock {
  margin-left: auto; 
  font-size: 1.6rem; 
  font-weight: 600; 
  color: var(--text-main);
  background: var(--bg-white);
  padding: 0.4rem 0.8rem;
  border-radius: var(--radius-sm);
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  flex: 0 0 auto;
}

.mode {
  background: var(--bg-white); 
  border: 1.5px solid var(--border-color); 
  border-radius: 20px;
  padding: 0.4rem 1rem; 
  font: inherit; 
  font-size: 1.1rem; 
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer; 
  flex: 0 0 auto; 
  line-height: 1.3;
  transition: all 0.2s ease;
}

.mode[aria-pressed="true"] {
  background: var(--brand-green); 
  border-color: var(--brand-green); 
  color: var(--bg-white);
  box-shadow: 0 2px 8px rgba(13, 100, 58, 0.3);
}

/* ---------- two decks (cards) ---------- */
.decks {
  flex: 1 1 auto; 
  min-height: 0;
  display: grid; 
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  padding-bottom: 0.5rem;
}

.deck {
  background: var(--bg-white);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  display: flex; 
  flex-direction: column; 
  min-height: 0; 
  min-width: 0; 
  overflow: hidden;
  border: 1px solid rgba(0,0,0,0.03);
}

.route {
  font-size: 1.2rem; 
  font-weight: 700; 
  color: var(--brand-green);
  white-space: nowrap;
  overflow: hidden; 
  text-overflow: ellipsis; 
  flex: 0 0 auto;
  background: rgba(13, 100, 58, 0.04);
  padding: 0.8rem 1rem;
  border-bottom: 1px solid var(--border-color);
}

.route i {
  font-style: normal; 
  font-weight: 600; 
  color: var(--bg-white); 
  background: var(--brand-green);
  padding: 0.2rem 0.6rem;
  border-radius: 4px;
  font-size: 0.9rem;
  letter-spacing: 0.05em; 
  margin-right: 0.8rem;
}

/* ---------- dynamic head area ---------- */
.strip {
  display: flex; 
  align-items: center; 
  justify-content: space-between;
  flex: 0 0 auto; 
  min-width: 0; 
  overflow: hidden; 
  white-space: nowrap;
  border-bottom: 1px solid var(--border-color); 
  padding: 1.2rem 1.4rem;
  background: var(--bg-white);
  transition: background 0.3s;
}

.strip.off {
  background: #F9FAFB;
}

.time-left {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
}

.mins { 
  font-size: 4.2rem; 
  line-height: 0.85; 
  font-weight: 700; 
  color: var(--accent-blue); 
}

.unit { 
  font-size: 1.2rem; 
  font-weight: 600;
  color: var(--text-muted); 
}

.msg {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--text-muted);
}

.next {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
}

.next span {
  font-size: 0.95rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  margin-bottom: 0.2rem;
}

.next b {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1;
}

/* ---------- full timetable ---------- */
.sheet {
  flex: 1 1 auto; 
  min-height: 0; 
  overflow-y: auto; 
  overscroll-behavior: contain; 
  scrollbar-width: none;
  position: relative; /* Fixed offsetTop for scrolling */
}

.sheet::-webkit-scrollbar { display: none; }

.sheet ul {
  list-style: none; 
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr));
  grid-auto-rows: 2.8rem;
  align-content: start;
  gap: 0.4rem;
  padding: 0.8rem;
}

.sheet li {
  font-size: 1.4rem; 
  line-height: 2.8rem; 
  text-align: center;
  border-radius: var(--radius-sm);
  color: var(--text-main);
  background: var(--bg-app);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  transition: background 0.2s, opacity 0.2s;
  cursor: default;
}

.sheet li:not(.now):not(.past):hover {
  background: var(--row-hover);
}

.sheet li.now {
  background: var(--brand-green); 
  color: var(--bg-white); 
  font-weight: 700; 
  box-shadow: 0 2px 6px rgba(13, 100, 58, 0.4);
  /* Accent lime indicator for the immediate next bus */
  border-left: 4px solid var(--accent-lime);
}

.sheet .empty {
  font-size: 1.4rem;
  line-height: 2.8rem;
  text-align: center;
  color: var(--text-muted);
  padding: 1rem;
}

</style>
</head>
<body>

<header class="bar">
  <h1>牽晴間穿梭巴士</h1>
  <span class="day" id="daylabel">—</span>
  <button class="mode" id="phbtn" aria-pressed="false">假期</button>
  <span class="clock num" id="clock">--:--</span>
</header>

<main class="decks" id="decks"></main>

<script>
/* ============================================================
   時間表 — 如管業處更改班次，只需修改以下四組數字
   格式為 "時:分"，每組請按時間順序排列
   ============================================================ */
var TIMETABLE = {
  weekday: {
    fromEstate: ["7:00","7:06","7:12","7:18","7:24","7:30","7:36","7:42","7:48","7:54",
      "8:00","8:06","8:12","8:18","8:24","8:30","8:36","8:42","8:48",
      "9:00","9:15","9:30","9:45","10:00","10:15","10:30","10:45",
      "11:00","11:15","11:30","11:45","12:00","12:15","12:30","12:45","12:55",
      "15:00","15:30","16:00","16:30","17:00","17:30","17:45",
      "18:00","18:10","18:20","18:30","18:40","18:50",
      "19:00","19:10","19:20","19:30","19:40","19:50",
      "20:00","20:10","20:20","20:30","20:40"],
    fromStation: ["7:05","7:11","7:17","7:23","7:29","7:35","7:41","7:47","7:53","7:59",
      "8:05","8:11","8:17","8:23","8:29","8:35","8:41","8:47","8:53",
      "9:05","9:20","9:35","9:50","10:05","10:20","10:35","10:50",
      "11:05","11:20","11:35","11:50","12:05","12:20","12:35","12:50",
      "15:05","15:35","16:05","16:35","17:05","17:25","17:35","17:50",
      "18:05","18:15","18:25","18:35","18:45","18:55",
      "19:05","19:15","19:25","19:35","19:45","19:55",
      "20:05","20:15","20:25","20:35","20:45"]
  },
  holiday: {
    fromEstate: ["7:00","7:06","7:12","7:18","7:24","7:30","7:36","7:42","7:48","7:54",
      "8:00","8:06","8:12","8:18","8:24","8:30","8:36","8:42","8:48",
      "9:00","9:15","9:30","9:45","10:00","10:15","10:30","10:45",
      "11:00","11:15","11:30","11:45","12:00","12:15","12:30","12:45","12:55",
      "15:00","15:15","15:30","15:45","16:00","16:15","16:30","16:45",
      "17:00","17:15","17:30","17:45","18:00","18:10","18:20","18:30","18:40",
      "19:00","19:20","19:40","20:00","20:20","20:40"],
    fromStation: ["7:05","7:11","7:17","7:23","7:29","7:35","7:41","7:47","7:53","7:59",
      "8:05","8:11","8:17","8:23","8:29","8:35","8:41","8:47","8:53",
      "9:05","9:20","9:35","9:50","10:05","10:20","10:35","10:50",
      "11:05","11:20","11:35","11:50","12:05","12:20","12:35","12:50",
      "15:05","15:20","15:35","15:50","16:05","16:20","16:35","16:50",
      "17:05","17:20","17:35","17:50","18:05","18:15","18:25","18:35","18:45",
      "19:05","19:15","19:25","19:45","20:05","20:25","20:35","20:45"]
  }
};

var HOLIDAYS = []; 

var DECKS = [
  { key:"fromEstate",  eyebrow:"出程", route:"牽晴間 → 粉嶺站" },
  { key:"fromStation", eyebrow:"回程", route:"粉嶺站 → 牽晴間" }
];

var forcePH = false;
var activeIndexes = { fromEstate: -1, fromStation: -1 };
var initialScrollDone = false;

function rescale(){
  var w = document.documentElement.clientWidth  || window.innerWidth;
  var h = document.documentElement.clientHeight || window.innerHeight;
  var u = Math.min(h / 21, w / 42);
  u = Math.max(5, Math.min(u, 15));
  document.documentElement.style.fontSize = u + "px";
}

function toMinutes(hhmm){
  var p = hhmm.split(":");
  return parseInt(p[0],10)*60 + parseInt(p[1],10);
}
function pad(n){ return n < 10 ? "0"+n : ""+n; }
function display(hhmm){
  var p = hhmm.split(":");
  return pad(parseInt(p[0],10)) + ":" + p[1];
}
function isHolidaySchedule(d){
  if (forcePH) return true;
  if (d.getDay() === 0) return true;
  var iso = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  return HOLIDAYS.indexOf(iso) !== -1;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function buildDeck(deck, times, nowMins){
  var upcoming = [];
  for (var i = 0; i < times.length; i++){
    if (toMinutes(times[i]) >= nowMins) upcoming.push(times[i]);
  }

  // Detect if the active bus has progressed
  var nextTime = upcoming.length > 0 ? upcoming[0] : null;
  var changed = (activeIndexes[deck.key] !== nextTime);
  activeIndexes[deck.key] = nextTime;

  var head;
  if (upcoming.length === 0){
    head = '<div class="time-left"><span class="msg">今日已尾班</span></div>'
         + '<div class="next"><span>Next</span><b class="num">' + display(times[0]) + '</b></div>';
  } else {
    var upcomingTime = upcoming[0];
    var mins = toMinutes(upcomingTime) - nowMins;
    var suspended = nowMins >= 780 && nowMins < 900;
    
    if (suspended){
      head = '<div class="time-left"><span class="msg">暫停服務</span></div>'
           + '<div class="next"><span>Next</span><b class="num">' + display(upcomingTime) + '</b></div>';
    } else if (mins === 0){
      head = '<div class="time-left"><span class="msg" style="color:var(--accent-blue)">即將開出</span></div>'
           + '<div class="next"><span>Next</span><b class="num">' + display(upcomingTime) + '</b></div>';
    } else {
      head = '<div class="time-left"><span class="mins num">' + mins + '</span><span class="unit">分鐘 min</span></div>'
           + '<div class="next"><span>Next</span><b class="num">' + display(upcomingTime) + '</b></div>';
    }
  }
  
  var offCls = (upcoming.length === 0 || (nowMins >= 780 && nowMins < 900)) ? " off" : "";

  // Render only upcoming buses
  var sheet;
  if (upcoming.length === 0) {
    sheet = '<div class="sheet"><div class="empty">明日 ' + display(times[0]) + ' 首班</div></div>';
  } else {
    sheet = '<div class="sheet"><ul>';
    for (var k = 0; k < upcoming.length; k++){
      var cls = (k === 0) ? "now" : "";
      sheet += '<li class="' + cls + '">' + display(upcoming[k]) + '</li>';
    }
    sheet += '</ul></div>';
  }

  var html = '<section class="deck">'
           + '<h2 class="route"><i>' + esc(deck.eyebrow) + '</i>' + esc(deck.route) + '</h2>'
           + '<div class="strip' + offCls + '">' + head + '</div>'
           + sheet + '</section>';

  return { html: html, changed: changed };
}

function render(){
  rescale();
  var now = new Date();
  var nowMins = now.getHours()*60 + now.getMinutes();
  var ph = isHolidaySchedule(now);
  var table = ph ? TIMETABLE.holiday : TIMETABLE.weekday;

  document.getElementById("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  document.getElementById("daylabel").textContent = ph ? "日 / 假期班次" : "一至六班次";

  var html = "";
  var anyIndexChanged = false;
  
  for (var i = 0; i < DECKS.length; i++){
    var buildRes = buildDeck(DECKS[i], table[DECKS[i].key], nowMins);
    html += buildRes.html;
    if (buildRes.changed) anyIndexChanged = true;
  }

  // Preserve user scroll positions before replacing innerHTML
  var oldSheets = document.querySelectorAll(".sheet");
  var scrolls = [];
  for(var i = 0; i < oldSheets.length; i++) {
    scrolls.push(oldSheets[i].scrollTop);
  }

  document.getElementById("decks").innerHTML = html;

  var newSheets = document.querySelectorAll(".sheet");
  
  // Intelligent Scrolling: Auto-scroll ONLY on first load, manual mode toggle, or when a bus departs
  if ((!initialScrollDone || anyIndexChanged) && newSheets.length > 0) {
    var lives = document.querySelectorAll(".sheet li.now");
    for (var m = 0; m < lives.length; m++){
      var box = lives[m].closest(".sheet");
      if (box && box.scrollHeight > box.clientHeight){
        var targetTop = Math.max(0, lives[m].offsetTop - box.clientHeight / 2 + lives[m].offsetHeight / 2);
        if (box.scrollTo) {
          box.scrollTo({ top: targetTop, behavior: initialScrollDone ? 'smooth' : 'auto' });
        } else {
          box.scrollTop = targetTop;
        }
      }
    }
    initialScrollDone = true;
  } else {
    // Restore the user's manual scroll position seamlessly
    for (var j = 0; j < newSheets.length; j++) {
      if (scrolls[j] !== undefined) {
        newSheets[j].scrollTop = scrolls[j];
      }
    }
  }
}

document.getElementById("phbtn").addEventListener("click", function(){
  forcePH = !forcePH;
  this.setAttribute("aria-pressed", forcePH ? "true" : "false");
  this.textContent = forcePH ? "假期 ✓" : "假期";
  initialScrollDone = false; // Force re-centering on mode change
  render();
});

function fetchHolidays() {
  fetch('https://www.1823.gov.hk/common/ical/en.json')
    .then(function(res) {
      if (!res.ok) throw new Error('API Network Error');
      return res.json();
    })
    .then(function(data) {
      if (data && data.vcalendar && data.vcalendar[0] && data.vcalendar[0].vevent) {
        var evs = data.vcalendar[0].vevent;
        var liveHolidays = [];
        
        for (var i = 0; i < evs.length; i++) {
          var start = evs[i].dtstart;
          var str = "";
          
          if (Array.isArray(start) && start.length > 0) {
            str = typeof start[0] === 'string' ? start[0] : (start[0].value || "");
          } else if (typeof start === 'string') {
            str = start;
          } else if (start && typeof start === 'object') {
            str = start.value || "";
          }
          
          if (str && str.length === 8) {
             var iso = str.substring(0,4) + "-" + str.substring(4,6) + "-" + str.substring(6,8);
             if (liveHolidays.indexOf(iso) === -1) {
               liveHolidays.push(iso);
             }
          }
        }
        
        if (liveHolidays.length > 0) {
          HOLIDAYS = liveHolidays;
          render(); 
        }
      }
    })
    .catch(function(err) {
      console.warn("Could not fetch holidays from API. Falling back to automatic Sunday handling only.", err);
    });
}

window.addEventListener("resize", render);
render();
fetchHolidays(); 
// Updates loop (runs every 10 seconds, but now preserves your scroll position!)
setInterval(render, 10000);
document.addEventListener("visibilitychange", function(){
  if (!document.hidden) render();
});
</script>
</body>
</html>
