<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="牽晴間村巴">
<meta name="theme-color" content="#EDE9DC">
<title>牽晴間村巴</title>
<style>
:root{
  --paper:#EDE9DC;
  --paper-2:#E4DFCE;
  --ink:#1C1B18;
  --ink-soft:#5A564A;
  --rule:#B9B3A0;
  --seal:#A4321F;
  --dim:#9A9484;
}
*{box-sizing:border-box;margin:0;padding:0}
html{
  -webkit-text-size-adjust:100%;
  /* JS overrides this; the value here is only a first-paint guess.
     Every size below is expressed in rem, so the whole widget scales
     with whatever box Android gives it. */
  font-size:10px;
  height:100%;
}
body{
  height:100%;
  overflow:hidden;
  background:var(--paper);
  color:var(--ink);
  font-family:"PingFang TC","Hiragino Sans CNS","Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif;
  padding:0.5rem 0.8rem 0.4rem;
  display:flex;
  flex-direction:column;
  -webkit-tap-highlight-color:transparent;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-0.01em}

/* ---------- one-line masthead ---------- */
.bar{
  display:flex;align-items:baseline;gap:0.7rem;
  border-bottom:1px solid var(--ink);
  padding-bottom:0.25rem;margin-bottom:0.35rem;
  flex:0 0 auto;white-space:nowrap;overflow:hidden;
}
.bar h1{font-size:1.2rem;font-weight:600;letter-spacing:0.03em;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.bar .day{font-size:0.95rem;color:var(--ink-soft);flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.bar .clock{margin-left:auto;font-size:1.4rem;font-weight:500;flex:0 0 auto;padding-left:0.5rem}
.mode{
  background:none;border:1px solid var(--rule);border-radius:0.2rem;
  padding:0.1rem 0.45rem;font:inherit;font-size:0.85rem;color:var(--ink-soft);
  cursor:pointer;flex:0 0 auto;line-height:1.3;
}
.mode[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---------- two decks side by side ---------- */
.decks{
  flex:1 1 auto;min-height:0;
  display:grid;grid-template-columns:1fr 1fr;gap:0 1.4rem;
}
.deck{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.deck + .deck{border-left:1px solid var(--rule);padding-left:1.4rem;margin-left:-0.7rem}

.route{
  font-size:1.1rem;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;
}
.route i{font-style:normal;font-weight:400;color:var(--ink-soft);letter-spacing:0.12em;margin-right:0.4rem}

/* countdown + the next two, all on ONE row.
   Every child is nowrap and non-growing; the row clips rather than
   wrapping, so nothing can ever spill into the neighbouring deck. */
.strip{
  display:flex;flex-wrap:nowrap;align-items:baseline;gap:0.45rem;
  flex:0 0 auto;min-width:0;overflow:hidden;white-space:nowrap;
  border-bottom:1px solid var(--rule);padding:0.1rem 0 0.3rem;
}
.strip > *{flex:0 0 auto;white-space:nowrap}
.mins{font-size:4rem;line-height:0.85;font-weight:500;color:var(--seal)}
.unit{font-size:1.1rem;color:var(--seal)}
.next{margin-left:auto;text-align:right}
.next b{font-size:2.3rem;font-weight:500}
.strip.off .mins,.strip.off .unit{color:var(--dim)}
.msg{font-size:1.6rem;font-weight:500;color:var(--dim)}

/* ---------- full timetable, fills all leftover pixels ---------- */
.sheet{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet ul{
  list-style:none;display:grid;
  /* column count is chosen by JS to maximise legible type, not fixed */
  grid-template-columns:repeat(var(--cols,4),1fr);
  /* row height is a variable: fixed by default, but JS grows it (up to
     a cap) when few departures remain, so the box is never half empty */
  grid-auto-rows:var(--rowh,1.95rem);
  align-content:start;
}
.sheet li{
  font-size:var(--rowf,1.3rem);line-height:var(--rowh,1.95rem);text-align:center;
  border-bottom:1px solid var(--paper-2);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;min-width:0;
}
.sheet li.now{background:var(--ink);color:var(--paper);font-weight:600;border-radius:0.15rem}
.sheet .empty{
  font-size:1.2rem;line-height:1.95rem;color:var(--dim);
}

/* ---------- short-widget fallbacks ---------- */
/* 5x1 and similar: there is not enough height for four stacked blocks,
   so drop the least essential ones instead of shrinking everything. */
body.compact .bar{display:none}
body.tiny .bar,
body.tiny .sheet{display:none}
body.tiny{padding:0.35rem 0.8rem}
body.tiny .route{font-size:1rem;margin-bottom:0.1rem}
body.tiny .strip{border-bottom:0;padding-bottom:0}

.note{font-size:1rem;color:var(--ink-soft);flex:0 0 auto;padding-top:0.2rem}
</style>
</head>
<body>

<header class="bar">
  <h1>牽晴間 穿梭巴士</h1>
  <span class="day" id="daylabel">—</span>
  <button class="mode" id="phbtn" aria-pressed="false">假期</button>
  <span class="clock num" id="clock">--:--</span>
</header>

<main class="decks" id="decks"></main>

<script>
/* ============================================================
   時間表 — 如管業處更改班次，只需修改以下四組數字
   格式為 "時:分"，每組請按時間順序排列
   ============================================================ */
var TIMETABLE = {
  weekday: {
    fromEstate: ["7:00","7:06","7:12","7:18","7:24","7:30","7:36","7:42","7:48","7:54",
      "8:00","8:06","8:12","8:18","8:24","8:30","8:36","8:42","8:48",
      "9:00","9:15","9:30","9:45","10:00","10:15","10:30","10:45",
      "11:00","11:15","11:30","11:45","12:00","12:15","12:30","12:45","12:55",
      "15:00","15:30","16:00","16:30","17:00","17:30","17:45",
      "18:00","18:10","18:20","18:30","18:40","18:50",
      "19:00","19:10","19:20","19:30","19:40","19:50",
      "20:00","20:10","20:20","20:30","20:40"],
    fromStation: ["7:05","7:11","7:17","7:23","7:29","7:35","7:41","7:47","7:53","7:59",
      "8:05","8:11","8:17","8:23","8:29","8:35","8:41","8:47","8:53",
      "9:05","9:20","9:35","9:50","10:05","10:20","10:35","10:50",
      "11:05","11:20","11:35","11:50","12:05","12:20","12:35","12:50",
      "15:05","15:35","16:05","16:35","17:05","17:25","17:35","17:50",
      "18:05","18:15","18:25","18:35","18:45","18:55",
      "19:05","19:15","19:25","19:35","19:45","19:55",
      "20:05","20:15","20:25","20:35","20:45"]
  },
  holiday: {
    fromEstate: ["7:00","7:06","7:12","7:18","7:24","7:30","7:36","7:42","7:48","7:54",
      "8:00","8:06","8:12","8:18","8:24","8:30","8:36","8:42","8:48",
      "9:00","9:15","9:30","9:45","10:00","10:15","10:30","10:45",
      "11:00","11:15","11:30","11:45","12:00","12:15","12:30","12:45","12:55",
      "15:00","15:15","15:30","15:45","16:00","16:15","16:30","16:45",
      "17:00","17:15","17:30","17:45","18:00","18:10","18:20","18:30","18:40",
      "19:00","19:20","19:40","20:00","20:20","20:40"],
    fromStation: ["7:05","7:11","7:17","7:23","7:29","7:35","7:41","7:47","7:53","7:59",
      "8:05","8:11","8:17","8:23","8:29","8:35","8:41","8:47","8:53",
      "9:05","9:20","9:35","9:50","10:05","10:20","10:35","10:50",
      "11:05","11:20","11:35","11:50","12:05","12:20","12:35","12:50",
      "15:05","15:20","15:35","15:50","16:05","16:20","16:35","16:50",
      "17:05","17:20","17:35","17:50","18:05","18:15","18:25","18:35","18:45",
      "19:05","19:15","19:25","19:45","20:05","20:25","20:35","20:45"]
  }
};

/* 公眾假期 — 星期日已自動識別，此處只需填非星期日的假期
   請每年核對政府公佈的日期後更新 */
var HOLIDAYS = [
  "2026-01-01","2026-02-17","2026-02-18","2026-02-19","2026-04-03","2026-04-06",
  "2026-04-07","2026-05-01","2026-05-24","2026-06-19","2026-07-01","2026-09-26",
  "2026-10-01","2026-10-19","2026-12-25","2026-12-26"
];

var DECKS = [
  { key:"fromEstate",  eyebrow:"出程", route:"牽晴間 → 粉嶺站" },
  { key:"fromStation", eyebrow:"回程", route:"粉嶺站 → 牽晴間" }
];

var forcePH = false;

/* ------------------------------------------------------------
   Fluid scale: one root font-size drives every dimension, so the
   layout fills whatever pixel box the launcher hands the widget.
   ------------------------------------------------------------ */
var MIN_U = 5, MAX_U = 46, GOOD_U = 9;

function applyU(u){ document.documentElement.style.fontSize = u + "px"; }
function curU(){ return parseFloat(document.documentElement.style.fontSize) || 10; }

/* Does anything spill at the current scale? Measured, not predicted — the
   widget host's viewport is not the CSS size we would guess from the grid. */
function overflows(){
  var vh = document.documentElement.clientHeight;
  var bar = document.querySelector(".bar");
  var barOn = bar && getComputedStyle(bar).display !== "none";
  var i, els;

  if (barOn && bar.scrollWidth > bar.clientWidth + 1) return true;
  els = document.querySelectorAll(".strip, .route");
  for (i = 0; i < els.length; i++){
    if (els[i].scrollWidth > els[i].clientWidth + 1) return true;
  }

  var cs = getComputedStyle(document.body);
  var need = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  if (barOn) need += bar.offsetHeight + parseFloat(getComputedStyle(bar).marginBottom);

  var deck = document.querySelector(".deck");
  if (deck){
    var r = deck.querySelector(".route"), s = deck.querySelector(".strip");
    if (r) need += r.offsetHeight;
    if (s) need += s.offsetHeight;
  }
  var sheet = document.querySelector(".sheet");
  if (sheet && getComputedStyle(sheet).display !== "none"){
    need += 2 * 1.95 * curU();          /* insist on room for two grid rows */
  }
  return need > vh;
}

/* Largest font scale at which the given tier still fits, by bisection. */
function bestU(mode){
  document.body.className = (mode === "full") ? "" : mode;
  var lo = MIN_U, hi = MAX_U, best = MIN_U, mid, i;
  for (i = 0; i < 11; i++){
    mid = (lo + hi) / 2;
    applyU(mid);
    if (!overflows()){ best = mid; lo = mid; } else { hi = mid; }
  }
  return best;
}

/* Choose the richest tier that still reads well, then scale it to fill. */
function rescale(){
  var tiers = ["full", "compact", "tiny"], res = [], i;
  for (i = 0; i < tiers.length; i++) res.push({ m: tiers[i], u: bestU(tiers[i]) });

  var pick = res[0];
  if (pick.u < GOOD_U){
    if (res[1].u >= GOOD_U) pick = res[1];
    else pick = (res[2].u > res[1].u) ? res[2] : res[1];
  }
  document.body.className = (pick.m === "full") ? "" : pick.m;
  applyU(pick.u);
}

/* Pick the column count that yields the largest legible type for however
   many departures are left, then size rows to consume the leftover height. */
function fillSheets(){
  var sheets = document.querySelectorAll(".sheet");
  for (var i = 0; i < sheets.length; i++){
    var ul = sheets[i].querySelector("ul");
    if (!ul) continue;
    var n = ul.children.length;
    if (!n) continue;

    var availH = sheets[i].clientHeight;
    var availW = sheets[i].clientWidth;
    if (availH <= 0 || availW <= 0) continue;

    var capF = curU() * 2.4;
    var best = null;
    for (var cols = 1; cols <= 10; cols++){
      var rows = Math.ceil(n / cols);
      var rowh = availH / rows;
      var colW = availW / cols;
      /* "20:20" is 5 tabular glyphs at ~0.58em, plus a gutter */
      var f = Math.min((colW * 0.86) / 3.1, rowh * 0.62, capF);
      if (!best || f > best.f) best = { f: f, cols: cols, rowh: rowh };
    }
    var fs = Math.max(6.5, best.f);
    ul.style.setProperty("--cols", best.cols);
    ul.style.setProperty("--rowh", Math.max(best.rowh, fs * 1.35) + "px");
    ul.style.setProperty("--rowf", fs + "px");
  }
}

function toMinutes(hhmm){
  var p = hhmm.split(":");
  return parseInt(p[0],10)*60 + parseInt(p[1],10);
}
function pad(n){ return n < 10 ? "0"+n : ""+n; }
function display(hhmm){
  var p = hhmm.split(":");
  return pad(parseInt(p[0],10)) + ":" + p[1];
}
function isHolidaySchedule(d){
  if (forcePH) return true;
  if (d.getDay() === 0) return true;
  var iso = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  return HOLIDAYS.indexOf(iso) !== -1;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function buildDeck(deck, times, nowMins){
  var upcoming = [];
  for (var i = 0; i < times.length; i++){
    if (toMinutes(times[i]) >= nowMins) upcoming.push(times[i]);
  }

  var head;
  if (upcoming.length === 0){
    head = '<span class="msg">今日已尾班</span>'
         + '<span class="next"><b class="num">' + display(times[0]) + '</b></span>';
  } else {
    var mins = toMinutes(upcoming[0]) - nowMins;
    var suspended = nowMins >= 780 && nowMins < 900;
    if (suspended){
      head = '<span class="msg">暫停服務</span>'
           + '<span class="next"><b class="num">' + display(upcoming[0]) + '</b></span>';
    } else if (mins === 0){
      head = '<span class="msg" style="color:var(--seal)">即將開出</span>'
           + '<span class="next"><b class="num">' + display(upcoming[0]) + '</b></span>';
    } else {
      head = '<span class="mins num">' + mins + '</span><span class="unit">分鐘</span>'
           + '<span class="next"><b class="num">' + display(upcoming[0]) + '</b></span>';
    }
  }
  var offCls = (upcoming.length === 0 || (nowMins >= 780 && nowMins < 900)) ? " off" : "";

  /* remaining departures only — anything already gone is dropped */
  var sheet;
  if (upcoming.length === 0){
    sheet = '<div class="sheet"><p class="empty">明日 ' + display(times[0]) + ' 首班</p></div>';
  } else {
    sheet = '<div class="sheet"><ul>';
    for (var k = 0; k < upcoming.length; k++){
      sheet += '<li class="' + (k === 0 ? "now" : "") + '">' + display(upcoming[k]) + '</li>';
    }
    sheet += '</ul></div>';
  }

  return '<section class="deck">'
       + '<h2 class="route"><i>' + esc(deck.eyebrow) + '</i>' + esc(deck.route) + '</h2>'
       + '<div class="strip' + offCls + '">' + head + '</div>'
       + sheet + '</section>';
}

function render(){
  var now = new Date();
  var nowMins = now.getHours()*60 + now.getMinutes();
  var ph = isHolidaySchedule(now);
  var table = ph ? TIMETABLE.holiday : TIMETABLE.weekday;

  document.getElementById("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  document.getElementById("daylabel").textContent = ph ? "日／假期班次" : "一至六班次";

  var html = "";
  for (var i = 0; i < DECKS.length; i++){
    html += buildDeck(DECKS[i], table[DECKS[i].key], nowMins);
  }
  document.getElementById("decks").innerHTML = html;
  /* content first, then measure-and-fit, then fill the grid */
  rescale();
  fillSheets();
}

document.getElementById("phbtn").addEventListener("click", function(){
  forcePH = !forcePH;
  this.setAttribute("aria-pressed", forcePH ? "true" : "false");
  this.textContent = forcePH ? "假期✓" : "假期";
  render();
});

window.addEventListener("resize", render);
render();
setInterval(render, 10000);
document.addEventListener("visibilitychange", function(){
  if (!document.hidden) render();
});
</script>
</body>
</html>
